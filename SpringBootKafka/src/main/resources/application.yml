info:
  appName: ${spring.application.name}
  appDesc: 'SrpingBoot Kafka'
  groupId: '@project.groupId@'
  artifactId: '@project.artifactId@'
  version: '@project.version@'

spring:
  profiles:
    active: dev
  thymeleaf:
    mode: HTML5
    encoding: UTF-8
    prefix: classpath:/templates
    servlet:
      content-type: text/html
  kafka:
    # 1. Kafka集群地址（核心）
    bootstrap-servers: 10.0.0.210:9092
    client-id: spring-boot-kafka
    # 2. 生产者配置
    producer:
      # 序列化方式（必须与消费者反序列化对应）
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # 消息确认机制（1=leader确认，all=所有副本确认，0=不确认）
      acks: 1
      # 重试次数
      retries: 3
      # 批量发送大小（16KB）
      batch-size: 16384
      # 延迟发送（1ms，凑批量）
      linger-ms: 1
    # 3. 消费者配置
    consumer:
      # 反序列化方式
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # 消费者组ID（必填，同一组负载均衡）
      group-id: springboot-kafka-group
      # 初始偏移量策略：earliest=从头消费，latest=从最新消费
      auto-offset-reset: earliest
      # 关闭自动提交偏移量（手动提交更可靠）
      enable-auto-commit: false
    # 4. 消费者监听容器配置（控制消费线程、批量消费等）
    listener:
      # 手动提交偏移量（需配合enable-auto-commit=false）
      ack-mode: manual_immediate
      # 消费线程数（建议等于Topic分区数）
      concurrency: 3
      # 批量消费的最大消息数（默认1，单条消费）
      batch:
        max-batch-size: 50
      # # 避免Topic不存在导致消费者启动失败（可选）
      missing-topics-fatal: false
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: nohi
  default-flat-param-object: true

knife4j:
  enable: true

logging:
  level:
    nohi: debug
